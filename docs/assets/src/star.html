<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MARIC star prompt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 640px; height: 160px; overflow: hidden; }
  .card {
    position: relative; width: 640px; height: 160px; overflow: hidden;
    background: linear-gradient(100deg, #f7f4fb 0%, #f1f1fb 55%, #eef3fb 100%);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #1d1d1f; -webkit-font-smoothing: antialiased;
  }
  .copy { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); }
  h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.03em; }
  .name {
    background: linear-gradient(90deg, #6a4dff 0%, #3f6dff 55%, #1f9e86 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 8px; font-size: 17px; line-height: 1.3; font-weight: 500; letter-spacing: -0.015em; color: #515154; }
  .button {
    position: absolute; left: 462px; top: 58px; width: 138px; height: 44px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid #d0d7de; border-radius: 10px; background: #f6f8fa;
    box-shadow: 0 1px 0 rgba(31, 35, 40, 0.04);
    font-size: 17px; font-weight: 600; color: #1f2328; letter-spacing: -0.01em;
  }
  .star { position: relative; width: 20px; height: 20px; }
  .star svg { position: absolute; inset: 0; width: 20px; height: 20px; }
  .label { position: relative; width: 62px; height: 22px; }
  .label span { position: absolute; left: 0; top: 0; line-height: 22px; }
  .spark { position: absolute; left: 10px; top: 10px; width: 2px; height: 7px; margin: -3.5px 0 0 -1px;
           border-radius: 2px; background: #e3b341; opacity: 0; }
  .ring { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%;
          border: 2px solid rgba(63, 109, 255, 0.55); opacity: 0; }
  .cursor { position: absolute; width: 22px; height: 30px; transform-origin: 2px 2px; }
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <h1>Find <span class="name">MARIC</span> useful?</h1>
      <div class="sub">Give it a star so more researchers can find it.</div>
    </div>
    <div class="button" id="button">
      <div class="star" id="star">
        <svg viewBox="0 0 20 20" id="outline"><path d="M10 2.2l2.35 4.9 5.35.7-3.92 3.72.98 5.32L10 14.3l-4.76 2.54.98-5.32L2.3 7.8l5.35-.7z"
          fill="none" stroke="#59636e" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 20 20" id="filled"><path d="M10 2.2l2.35 4.9 5.35.7-3.92 3.72.98 5.32L10 14.3l-4.76 2.54.98-5.32L2.3 7.8l5.35-.7z"
          fill="#e3b341" stroke="#d29922" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </div>
      <div class="label"><span id="l1">Star</span><span id="l2">Starred</span></div>
    </div>
    <div class="ring" id="ring"></div>
    <svg class="cursor" id="cursor" viewBox="0 0 22 30">
      <path d="M2 2 L2 24 L7.6 18.8 L11.4 27.4 L15.2 25.8 L11.5 17.3 L19 17.3 Z"
        fill="#1d1d1f" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </div>
<script>
  // render(t) draws the frame at t seconds; the loop is 4 s long and t = 0 equals t = 4.
  const $ = (id) => document.getElementById(id);
  const star = $("star"), sparks = [];
  for (let i = 0; i < 8; i++) { const s = document.createElement("div"); s.className = "spark"; star.appendChild(s); sparks.push(s); }
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const lerp = (a, b, x) => a + (b - a) * x;
  const target = { x: 548, y: 84 }, start = { x: 660, y: 190 }, away = { x: 600, y: 196 };
  window.render = function (t) {
    // cursor: enters 0.15-0.95 s, clicks at 1.0 s, rests, leaves 3.2-3.7 s
    let cx, cy;
    if (t < 3.2) { const k = easeOut(seg(t, 0.15, 0.95)); cx = lerp(start.x, target.x, k); cy = lerp(start.y, target.y, k); }
    else { const k = easeInOut(seg(t, 3.2, 3.7)); cx = lerp(target.x, away.x, k); cy = lerp(target.y, away.y, k); }
    const press = t >= 0.98 && t < 1.12 ? 0.86 : 1;
    $("cursor").style.transform = `translate(${cx - 2}px, ${cy - 2}px) scale(${press})`;

    // button: hover while the cursor is on it, pressed for a moment
    const hover = seg(t, 0.8, 0.95) * (1 - seg(t, 3.25, 3.45));
    const pressed = t >= 0.98 && t < 1.12;
    const btn = $("button");
    btn.style.background = hover > 0 ? `rgb(${lerp(246, 238, hover)}, ${lerp(248, 241, hover)}, ${lerp(250, 244, hover)})` : "#f6f8fa";
    btn.style.transform = `scale(${pressed ? 0.97 : 1})`;

    // star state: on from 1.0 s; after the cursor leaves, the content fades out (3.5-3.68 s),
    // switches back to Star at 3.7 s and fades in (3.72-3.92 s), so the labels never overlap
    const on = t >= 1.0 && t < 3.7 ? 1 : 0;
    const pop = seg(t, 1.0, 1.35);
    const scale = pop < 0.45 ? lerp(0.3, 1.35, pop / 0.45) : lerp(1.35, 1, (pop - 0.45) / 0.55);
    $("filled").style.opacity = on;
    $("filled").style.transform = `scale(${scale})`;
    $("outline").style.opacity = 1 - on;
    $("l1").style.opacity = 1 - on;
    $("l2").style.opacity = on;
    const content = t < 3.7 ? 1 - seg(t, 3.5, 3.68) : seg(t, 3.72, 3.92);
    $("star").style.opacity = content;
    document.querySelector(".label").style.opacity = content;

    // sparks radiate 1.0-1.5 s
    const sp = seg(t, 1.0, 1.5);
    sparks.forEach((s, i) => {
      const angle = (i * 45) * Math.PI / 180, d = lerp(9, 22, easeOut(sp));
      s.style.opacity = sp > 0 && sp < 1 ? (1 - sp) : 0;
      s.style.transform = `translate(${Math.sin(angle) * d}px, ${-Math.cos(angle) * d}px) rotate(${i * 45}deg)`;
    });

    // click ring at the cursor tip, 1.0-1.45 s
    const r = seg(t, 1.0, 1.45);
    const ring = $("ring");
    ring.style.left = `${target.x}px`; ring.style.top = `${target.y}px`;
    ring.style.opacity = r > 0 && r < 1 ? (1 - r) * 0.9 : 0;
    ring.style.transform = `scale(${lerp(0.4, 1.6, easeOut(r))})`;
  };
  render(0);
</script>
</body>
</html>
